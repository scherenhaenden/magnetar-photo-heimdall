name: Desktop distribution

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      # The verify job rejects non-timestamp tags before any artifact is built.
      - '*.*.*.*.*.*'

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  PROJECT: Magnetar.Photo.Heimdall.Desktop/Magnetar.Photo.Heimdall.Desktop.csproj
  APP_NAME: Magnetar.Photo.Heimdall.Desktop

jobs:
  verify:
    name: Verify real integration paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Magnetar.Photo.Heimdall.slnx
      - name: Build
        run: dotnet build Magnetar.Photo.Heimdall.slnx --configuration Release --no-restore
      - name: Validate timestamp release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Release tags must use yyyy.MM.dd.HH.mm.ss: $tag" >&2
            exit 1
          fi
          timestamp="${tag:0:4}-${tag:5:2}-${tag:8:2} ${tag:11:2}:${tag:14:2}:${tag:17:2} UTC"
          date --utc --date="$timestamp" '+%Y-%m-%dT%H:%M:%SZ' >/dev/null
      - name: Run SQLite and filesystem integration checks
        run: dotnet run --project Magnetar.Photo.Heimdall.IntegrationTests --configuration Release --no-build
      - name: Run media-analysis integration checks
        run: dotnet run --project Magnetar.Photo.Heimdall.MediaAnalysis.IntegrationTests --configuration Release --no-build
      - name: Run remote-contract integration checks
        run: dotnet run --project Magnetar.Photo.Heimdall.RemoteContracts.IntegrationTests --configuration Release --no-build
      - name: Run desktop integration tests
        run: dotnet test Magnetar.Photo.Heimdall.Desktop.IntegrationTests --configuration Release --no-build

  package:
    name: Package ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Debian amd64
            os: ubuntu-latest
            rid: linux-x64
            artifact: magnetar-photo-heimdall-debian-amd64
            kind: debian
          - label: Windows x64
            os: windows-latest
            rid: win-x64
            artifact: magnetar-photo-heimdall-windows-x64
            kind: windows
          - label: macOS Apple Silicon
            os: macos-14
            rid: osx-arm64
            artifact: magnetar-photo-heimdall-macos-arm64
            kind: macos
          - label: macOS Intel
            os: macos-14
            rid: osx-x64
            artifact: magnetar-photo-heimdall-macos-x64
            kind: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish self-contained desktop application
        shell: bash
        run: >-
          dotnet publish "$PROJECT" --configuration Release --runtime "${{ matrix.rid }}"
          --self-contained true --output publish
          -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false
      - name: Create Debian package
        if: matrix.kind == 'debian'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then version="0.0.0+ci.${GITHUB_RUN_NUMBER}"; fi
          root="package-root"
          mkdir -p "$root/DEBIAN" "$root/opt/magnetar-photo-heimdall" "$root/usr/share/applications"
          cp -R publish/. "$root/opt/magnetar-photo-heimdall/"
          cat > "$root/DEBIAN/control" <<EOF
          Package: magnetar-photo-heimdall
          Version: $version
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: Magnetar Photo Heimdall
          Description: Local-first photo library organizer
          EOF
          cat > "$root/usr/share/applications/magnetar-photo-heimdall.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Magnetar Photo Heimdall
          Comment=Local-first photo library organizer
          Exec=/opt/magnetar-photo-heimdall/$APP_NAME
          Categories=Graphics;Utility;
          Terminal=false
          EOF
          chmod 0755 "$root/opt/magnetar-photo-heimdall/$APP_NAME"
          mkdir -p dist
          dpkg-deb --build --root-owner-group "$root" "dist/magnetar-photo-heimdall_${version}_amd64.deb"
      - name: Create Windows ZIP distribution
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath dist/magnetar-photo-heimdall-windows-x64.zip
      - name: Create macOS TAR.GZ distribution
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          tar -C publish -czf "dist/magnetar-photo-heimdall-${{ matrix.rid }}.tar.gz" .
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
